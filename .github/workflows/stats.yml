name: Redraw stats card

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stats.py benz16107
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Committed as the Actions bot, so the daily redraw never adds a square to Ben's graph.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg stats-dark.svg
          git diff --cached --quiet || { git commit -m "Redraw stats card" && git push; }
